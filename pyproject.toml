[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "crop-pipeline"
version = "0.1.0"
description = "Carrot, cabbage and potato classification pipeline from labelled parcels and Sentinel-2 imagery"
requires-python = ">=3.12"
# Pinned runtime dependencies stay in requirements-notebooks.txt.

[tool.setuptools.packages.find]
where = ["src"]
